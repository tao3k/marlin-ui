# Desktop-Special Extension Overlay for Marlin UI keymaps.
#
# IMPORTANT — Single Source of Truth Architecture:
#   1. Authoritative Scheme Keymaps & Transients (`marlin.ui.v1` gRPC):
#      `scheme/ui-meow/key-bindings.ss` and `scheme/ui-magit/objects.ss` own ALL
#      Doom `SPC` leader maps, `SPC g` (+git / Magit), all 14 `magit:*` transients,
#      and canonical native Emacs chords (`C-x g`, `C-x M-g`, `C-c g`, `C-c M-g`,
#      `C-x 0..3/o/b/p/t/w/z`, `C-c u/U`, `C-h r/?`). They are streamed live over
#      gRPC (`UiWorkbenchSnapshot.{keymap, transients}`) — NEVER duplicate them here.
#   2. Desktop-Special Extensions (this file ONLY):
#      Desktop-only GUI surfaces that Scheme/TUI does not own: Liquid Glass / Motion /
#      Theme packs (`SPC t`), Packages (`SPC p`), Settings (`SPC ,`), Marlin Desktop
#      session (`SPC m`), Desktop buffer shortcuts (`SPC b`), and legacy `SPC l` alias.
#   3. Downstream User Override (`~/.config/marlin/ui/keymaps.toml`):
#      Users may override or extend ANY Scheme or Desktop key, keypad, or transient
#      and hot-reload live with `SPC t r` / `M-x reload-theme`.

[[heads]]
prefix = "SPC"
key = "l"
label = "+workspaces (alias)"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC l"

[[heads]]
prefix = "SPC"
key = "t"
label = "+themes & toggles"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC t"

[[heads]]
prefix = "SPC"
key = "m"
label = "+marlin session"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC m"

[[heads]]
