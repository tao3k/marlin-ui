# Desktop-Special Extension Overlay for Marlin UI keymaps.
#
# Layering order (downstream users may override or extend any key in
# ~/.config/marlin/ui/keymaps.toml and hot-reload with SPC t r):
#   1. Authoritative Doom Emacs Base (`scheme/ui-meow/key-bindings.ss`):
#      SPC, SPC b, SPC w (splits / winum 1..9 / winner-mode / dedicated),
#      SPC TAB (persp-mode workspaces), SPC ~ (popup toggle).
#   2. Desktop-Special Extensions (this file):
#      Liquid Glass / Motion / Zen / Theme packs (SPC t), Packages (SPC p),
#      Settings (SPC ,), Marlin Session (SPC m), Desktop buffer shortcuts (SPC b),
#      and legacy SPC l alias for +workspaces.
#   3. User Overlay (`~/.config/marlin/ui/keymaps.toml`):
#      Per-(prefix, key) merge — overrides matching keys and appends new ones.

[[heads]]
prefix = "SPC"
key = "l"
label = "+workspaces (alias)"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC l"

[[heads]]
prefix = "SPC"
key = "t"
label = "+themes & toggles"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC t"

[[heads]]
prefix = "SPC"
key = "m"
label = "+marlin session"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC m"

[[heads]]
prefix = "SPC"
key = "i"
label = "Compose message (Insert)"
column = "System"
exit = "true"
action = "cmd:insert"

[[heads]]
prefix = "SPC"
key = ","
label = "Private config (*Settings*)"
column = "System"
exit = "true"
action = "buffer:*Settings*"

[[heads]]
prefix = "SPC"
key = "p"
label = "Packages (*Packages* Marketplace)"
column = "System"
exit = "true"
action = "buffer:*Packages*"

