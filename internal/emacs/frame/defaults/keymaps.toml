# Default declarative SPC Doom Leader / Hydra keymap catalog for Marlin UI.
# Users may customize or extend bindings in ~/.config/marlin/ui/keymaps.toml
# and hot-reload live with SPC t r / M-x reload-theme.

[[hydras]]
prefix = "SPC"
id = "leader"
title = "Doom Leader / Hydra"

[[heads]]
prefix = "SPC"
key = "SPC"
label = "Execute command (M-x)"
column = "Commands"
exit = "true"
action = "cmd:mx"

[[heads]]
prefix = "SPC"
key = "x"
label = "M-x command palette"
column = "Commands"
exit = "true"
action = "cmd:mx"

[[heads]]
prefix = "SPC"
key = "s"
label = "Helm live search"
column = "Commands"
exit = "true"
action = "cmd:helm"

[[heads]]
prefix = "SPC"
key = "b"
label = "+buffers"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC b"

[[heads]]
prefix = "SPC"
key = "w"
label = "+windows & popups"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC w"

[[heads]]
prefix = "SPC"
key = "l"
label = "+workspaces"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC l"

[[heads]]
prefix = "SPC"
key = "t"
label = "+themes & toggles"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC t"

[[heads]]
prefix = "SPC"
key = "m"
label = "+marlin session"
column = "Navigation"
is_prefix = "true"
action = "hydra:SPC m"

[[heads]]
prefix = "SPC"
key = "i"
label = "Compose message (Insert)"
column = "System"
exit = "true"
action = "cmd:insert"

[[heads]]
prefix = "SPC"
key = "h"
label = "Documentation (*Help*)"
column = "System"
exit = "true"
action = "buffer:*Help*"

[[heads]]
prefix = "SPC"
key = ","
label = "Private config (*Settings*)"
column = "System"
exit = "true"
action = "buffer:*Settings*"

[[heads]]
prefix = "SPC"
key = "p"
label = "Packages (*Packages* Marketplace)"
column = "System"
exit = "true"
action = "buffer:*Packages*"

