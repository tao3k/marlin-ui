# Default declarative M-x command catalog for Marlin UI.
# Users may override or extend commands via ~/.config/marlin/ui/commands.toml
# and hot-reload live with SPC t r / M-x reload-theme.

[[commands]]
name = "helm"
desc = "Open interactive 120Hz Helm search (SPC s)"
action = "cmd:helm"

[[commands]]
name = "switch-buffer"
desc = "Switch active Emacs buffer (SPC b b)"
action = "cmd:switch-buffer"

[[commands]]
name = "dashboard"
desc = "Open *Dashboard* EWW Bento widget desktop (SPC b d)"
action = "buffer:*Dashboard*"

[[commands]]
name = "toggle-glass"
desc = "Hot-plug Liquid Glass GPU surface via marlin-mygo/features (SPC t v)"
action = "cmd:toggle-glass"

[[commands]]
name = "cycle-glass-opacity"
desc = "Cycle frosted glass opacity preset Clear/Balanced/Frosted/Deep (SPC t o)"
action = "cmd:cycle-glass-opacity"

[[commands]]
name = "toggle-motion"
desc = "Hot-plug 120Hz Spring Motion via marlin-mygo/features (SPC t a)"
action = "cmd:toggle-motion"

[[commands]]
name = "zen-mode"
desc = "Toggle immersive Zen Mode (hide tabs & modeline, SPC t z)"
action = "cmd:zen-mode"

[[commands]]
name = "switch-themes"
desc = "Switch CSS theme pack (SPC t t)"
action = "cmd:switch-theme"

[[commands]]
name = "reload-theme"
desc = "Reload ~/.config/marlin/ui/ themes, CSS, keymaps & widgets (SPC t r)"
action = "cmd:reload-theme"

[[commands]]
name = "init-ui-config"
desc = "Scaffold starter ~/.config/marlin/ui/{manifest.toml, tokens.json}"
action = "cmd:init-ui-config"

[[commands]]
name = "sessions"
desc = "Open *Sessions* recorded conversations"
action = "buffer:*Sessions*"

[[commands]]
name = "targets"
desc = "Open *Targets* federation gRPC hosts"
action = "buffer:*Targets*"

[[commands]]
name = "models"
desc = "Open *Models* configured model routes"
action = "buffer:*Models*"

[[commands]]
name = "list-processes"
desc = "Open *Processes* managed runtime processes"
action = "buffer:*Processes*"

[[commands]]
name = "messages"
desc = "Open *Messages* UI diagnostics log"
action = "buffer:*Messages*"

[[commands]]
name = "help"
desc = "Open *Help* Meow & Doom keybindings"
action = "buffer:*Help*"

[[commands]]
name = "settings"
desc = "Open *Settings* customize & hot-pluggable modules buffer"
action = "buffer:*Settings*"

[[commands]]
name = "new-session"
desc = "Create and switch to a fresh session"
action = "cmd:new-session"

[[commands]]
name = "probe-targets"
desc = "Probe all registered Rust federation targets"
action = "cmd:probe-targets"

[[commands]]
name = "review-gate"
desc = "Review pending approval gate in Minibuffer (y or n)"
action = "cmd:review-gate"

[[commands]]
name = "open-workflow-canvas"
desc = "Open *Workflow Canvas* Hybrid GPU + Sandboxed WebView BPMN Studio"
action = "feature:webisland"

[[commands]]
name = "list-packages"
desc = "Open *Packages* Official Marketplace package manager (SPC p)"
action = "buffer:*Packages*"

[[commands]]
name = "marketplace"
desc = "Browse & install Official Marketplace themes, plugins & layouts"
action = "buffer:*Packages*"

[[commands]]
name = "package-refresh-contents"
desc = "Refresh Official Marketplace registry index from tao3k/marlin-ui-marketplace"
action = "cmd:refresh-packages"

[[commands]]
name = "split-window-right"
desc = "Split active workspace vertically left | right (SPC w v)"
action = "cmd:win-split-right"

[[commands]]
name = "split-window-below"
desc = "Split active workspace horizontally top / bottom (SPC w s)"
action = "cmd:win-split-below"

[[commands]]
name = "delete-other-windows"
desc = "Collapse split panes to focused window only (SPC w o)"
action = "cmd:win-only"

[[commands]]
name = "other-window"
desc = "Cycle focus between active split windows (SPC w w)"
action = "cmd:win-other"

[[commands]]
name = "winum-select-window-1"
desc = "Jump directly to window 1 (SPC w 1)"
action = "cmd:win-1"

[[commands]]
name = "winum-select-window-2"
desc = "Jump directly to window 2 (SPC w 2)"
action = "cmd:win-2"

[[commands]]
name = "winum-select-window-3"
desc = "Jump directly to window 3 (SPC w 3)"
action = "cmd:win-3"

[[commands]]
name = "winner-undo"
desc = "Restore previous window layout in active workspace (SPC w u)"
action = "cmd:win-undo"

[[commands]]
name = "winner-redo"
desc = "Redo undone window layout in active workspace (SPC w U)"
action = "cmd:win-redo"

[[commands]]
name = "toggle-window-dedicated"
desc = "Pin/unpin focused window to its buffer (SPC w t)"
action = "cmd:win-dedicated"

[[commands]]
name = "swap-window-panes"
desc = "Swap primary and secondary split pane buffers (SPC w x)"
action = "cmd:win-swap"

[[commands]]
name = "balance-windows"
desc = "Reset split panes to an equal 50/50 ratio (SPC w e)"
action = "cmd:win-balance"

[[commands]]
name = "popup-toggle"
desc = "Toggle active workspace's Doom popup drawer (SPC w p)"
action = "cmd:popup-toggle"

[[commands]]
name = "popup-raise"
desc = "Promote active popup drawer into a main window tab (SPC w r)"
action = "cmd:popup-raise"

[[commands]]
name = "workspace-new"
desc = "Create a new named isolated persp-mode workspace (SPC l c)"
action = "cmd:ws-create-prompt"

[[commands]]
name = "workspace-kill"
desc = "Kill active workspace if others remain (SPC l d)"
action = "cmd:ws-kill"
