<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marlin UI</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #282c34;
        color: #d5dce6;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      }
      #marlin-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #8b94a6;
        background: radial-gradient(circle at 50% 20%, rgba(81, 175, 239, 0.14), transparent 55%), #282c34;
      }
    </style>
  </head>
  <body>
    <div id="marlin-boot">Loading Marlin UI...</div>
    <script src="./wasm_exec.js"></script>
    <script>
      (async () => {
        const go = new Go();
        const res = await WebAssembly.instantiateStreaming(fetch("./marlin-web.wasm"), go.importObject);
        const boot = document.getElementById("marlin-boot");
        if (boot) boot.remove();
        go.run(res.instance);
      })().catch((err) => {
        const boot = document.getElementById("marlin-boot");
        if (boot) boot.textContent = "Failed to load marlin-web.wasm: " + err;
      });
    </script>
  </body>
</html>
